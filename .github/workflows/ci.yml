name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - name: Check generated API files
        shell: pwsh
        run: git diff --exit-code -- docs/API.md types/LUI.d.luau types/schema.json

  linux:
    name: Linux headless tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure
        run: cmake -S . -B build/linux-x64 -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/linux-x64 --parallel 2 --target LuiHeadlessTests LuiLayoutTests LuiConformanceTests LuiSchemaDump LuiTypeTests LuiTypeCheck LuiExtensionTests LuiHostTests LuiSandboxTests LuiThemeTests LuiPlatformTests LuiAssetTests LuiNetworkTests LuiSampleExtension LuiFailedExtension LuiBadAbiExtension LuiExtraCapabilityExtension LuiLegacyExtension
      - name: Test
        run: ctest --test-dir build/linux-x64 --output-on-failure
      - name: CLI tests
        run: |
          dotnet build tools/cli/Lui.Cli.csproj --configuration Release
          dotnet run --project tests/cli/CliTests.csproj --configuration Release -- build/linux-x64/libLuiRuntime.so build/linux-x64/LuiTypeCheck
          dotnet tools/cli/bin/Release/net9.0/lui.dll check examples/dashboard/dashboard.manifest.json --checker build/linux-x64/LuiTypeCheck
      - name: Preview protocol tests
        run: |
          dotnet build tools/preview-host/Lui.PreviewHost.csproj --configuration Release
          dotnet run --project tests/preview/PreviewTests.csproj --configuration Release -- tools/preview-host/bin/Release/net9.0/lui-preview-host.dll build/linux-x64/libLuiRuntime.so
      - name: VS Code preview client tests
        env:
          LUI_TEST_PREVIEW_HOST: tools/preview-host/bin/Release/net9.0/lui-preview-host.dll
          LUI_TEST_RUNTIME: build/linux-x64/libLuiRuntime.so
          LUI_TEST_CLI: tools/cli/bin/Release/net9.0/lui.dll
          LUI_TEST_TYPECHECK: build/linux-x64/LuiTypeCheck
        run: node --test tests/editor/EditorTests.js tests/editor/TypeTests.js
      - name: Check generated schema
        run: |
          build/linux-x64/LuiSchemaDump > build/linux-x64/schema.json
          cmp types/schema.json build/linux-x64/schema.json
